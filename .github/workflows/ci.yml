name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Pruebas
        run: npm test

      - name: Validar datos
        run: npm run validate

      # Detecta que alguien haya editado una ficha sin regenerar el bundle.
      - name: El bundle esta al dia
        run: |
          npm run build
          git diff --exit-code data/tree-bundle.json
