<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="detail.title.pageDefault">Ficha personal | {{siteName}}</title>
    <meta name="description" content="{{descriptions.detail}}" />
    <meta name="theme-color" content="{{themeColor}}" />
    <meta name="robots" content="noindex, follow" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Ficha personal | {{siteName}}" />
    <link rel="icon" href="{{favicon}}" type="image/svg+xml" />
    <script src="js/config/app-config.js"></script>
    <script src="js/theme-boot.js"></script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido" data-i18n="common.nav.skip">Saltar al contenido</a>

    <main class="page page--detail" id="contenido">
      <nav class="site-nav" aria-label="Navegación principal" data-i18n-attr="aria-label:common.nav.mainAria">
        <a class="site-nav__link" href="index.html" data-i18n="common.nav.list">Listado</a>
        <a class="site-nav__link" id="person-tree-link" href="arbol.html" data-i18n="common.nav.tree"
          >Árbol genealógico</a
        >
        <span class="site-nav__link site-nav__link--current" data-i18n="common.nav.detail"
          >Ficha personal</span
        >
      </nav>

      <p id="person-status" class="visually-hidden" role="status" aria-live="polite"></p>

      <section class="hero hero--detail">
        <p class="eyebrow" data-i18n="detail.hero.eyebrow">Ficha personal</p>
        <h1 id="person-name" data-i18n="detail.hero.loadingName">Cargando...</h1>
        <p class="description" id="person-summary"></p>
      </section>

      <section class="detail-grid">
        <article class="detail-card">
          <h2 data-i18n="detail.sections.general">Información general</h2>
          <dl class="detail-list" id="person-facts">
            <div>
              <dt data-i18n="detail.sections.status">Estado</dt>
              <dd data-i18n="detail.messages.loading">Cargando datos...</dd>
            </div>
          </dl>
        </article>

        <article class="detail-card">
          <h2 data-i18n="detail.sections.mainImage">Imagen principal</h2>
          <figure class="detail-figure" id="person-figure" hidden>
            <picture>
              <source id="person-image-webp" type="image/webp" />
              <!-- Las dimensiones reales las pone js/detail/render.js al cargar la ficha:
                   un valor fijo aqui seria una proporcion equivocada para casi todas. -->
              <img id="person-image" alt="" decoding="async" />
            </picture>
            <figcaption id="person-image-caption"></figcaption>
          </figure>
        </article>
      </section>

      <section class="detail-card">
        <h2 data-i18n="detail.sections.biography">Biografía</h2>
        <div id="person-biography"></div>
      </section>

      <section class="detail-card">
        <div class="table-header">
          <h2 data-i18n="detail.sections.gallery">Galería</h2>
          <p data-i18n="detail.sections.galleryDescription">
            Imágenes y documentos asociados a esta memoria personal.
          </p>
        </div>
        <div class="gallery-grid" id="person-gallery"></div>
      </section>
    </main>

    <noscript>
      <p class="noscript-message" data-i18n="common.noscript.generic">
        Esta página necesita JavaScript para mostrar el contenido.
      </p>
    </noscript>

    <script type="module" src="js/detail.js"></script>
  </body>
</html>
