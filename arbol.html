<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arbol genealogico - Familia Minguez · De Antonio</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/family-chart@0.9.0/dist/styles/family-chart.css">
  <link rel="stylesheet" href="css/arbol.css">
</head>
<body>
  <main class="page page--arbol">
    <nav class="site-nav" aria-label="Navegacion principal">
      <a class="site-nav__link" href="index.html">Listado</a>
      <a class="site-nav__link site-nav__link--active" href="arbol.html" aria-current="page">Arbol genealogico</a>
    </nav>

    <section class="hero">
      <p class="eyebrow">Arbol genealogico</p>
      <h1>Familia Minguez · De Antonio</h1>
      <p class="lead">Representacion visual de los lazos familiares.</p>
    </section>

    <section class="tree-section" aria-label="Arbol genealogico interactivo">
      <div class="tree-toolbar" role="toolbar" aria-label="Controles del arbol">
        <button class="tree-btn" id="btn-zoom-in" aria-label="Acercar">+</button>
        <button class="tree-btn" id="btn-zoom-out" aria-label="Alejar">-</button>
        <button class="tree-btn" id="btn-fit" aria-label="Ajustar vista">Fit</button>
        <button class="tree-btn" id="btn-show-all" aria-pressed="false" aria-label="Alternar modo de enfoque">Modo: Vista global</button>
        <a class="tree-btn tree-btn--back" href="index.html">&larr; Volver</a>
      </div>

      <div class="tree-viewport-wrapper" id="tree-wrapper">
        <div class="f3 f3-cont tree-canvas" id="tree-canvas"></div>
        <p class="tree-loading" id="tree-loading">Cargando arbol...</p>
        <p class="tree-error" id="tree-error" hidden>No se pudo cargar el arbol genealogico.</p>
      </div>
    </section>
  </main>

  <aside class="tree-panel" id="tree-panel" aria-label="Ficha de la persona" hidden>
    <button class="tree-panel__close" id="tree-panel-close" aria-label="Cerrar ficha">X</button>
    <div class="tree-panel__header" id="tree-panel-header"></div>
    <div class="tree-panel__body" id="tree-panel-body"></div>
  </aside>

  <noscript class="noscript-message">
    El arbol genealogico requiere JavaScript activado.
  </noscript>

  <script src="https://unpkg.com/d3@7"></script>
  <script src="https://unpkg.com/family-chart@0.9.0/dist/family-chart.min.js"></script>
  <script type="module" src="js/arbol.js"></script>
</body>
</html>
